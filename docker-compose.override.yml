# Rafeeq Kernel — Local Development Overrides
# This file is automatically loaded by docker-compose
# Copy from docker-compose.override.yml.example and customize

version: "3.9"

services:
  app:
    volumes:
      - .:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - RATE_LIMIT_ENABLED=false
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
